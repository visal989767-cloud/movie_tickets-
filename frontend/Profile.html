<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEGEND CINEMA · Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet" />
    <style>
        /* ─── reset & base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #07090c;
            --surface-glass: rgba(18, 22, 28, 0.75);
            --surface-elevated: rgba(22, 26, 32, 0.9);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.18);
            --red-cinema: #E31E24;
            --red-glow: #ff4d52;
            --red-dim: rgba(227, 30, 36, 0.15);
            --text-primary: #F0F2F5;
            --text-secondary: #9aa0b0;
            --text-muted: #5f6673;
            --shadow-red: 0 8px 24px rgba(227, 30, 36, 0.25);
            --transition-smooth: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            --radius-card: 1.5rem;
            --radius-full: 3rem;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ─── cinematic backdrop ─── */
        .cinema-backdrop {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #1a1e2b 0%, #030405 90%);
        }

        .light-bleed {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .light-bleed::before {
            content: "";
            position: absolute;
            width: 80vw;
            height: 70vw;
            background: radial-gradient(circle at 30% 40%, rgba(227, 30, 36, 0.12) 0%, transparent 70%);
            top: -15%;
            left: -10%;
            filter: blur(90px);
            animation: slowDrift 18s infinite alternate ease-in-out;
        }
        .light-bleed::after {
            content: "";
            position: absolute;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle at 70% 70%, rgba(30, 100, 220, 0.08) 0%, transparent 70%);
            bottom: -20%;
            right: -10%;
            filter: blur(100px);
            animation: slowDrift 22s infinite alternate-reverse ease-in-out;
        }

        @keyframes slowDrift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(4%, 3%) scale(1.1);
            }
        }

        /* ─── navbar ─── */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(11, 15, 26, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(227, 30, 36, 0.25);
            flex-wrap: wrap;
            gap: 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, var(--red-cinema), #b01016);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(227, 30, 36, 0.3);
            overflow: hidden;
            padding: 4px;
            flex-shrink: 0;
        }
        .logo-icon i {
            font-size: 1.5rem;
            color: #fff;
        }
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            padding: 4px;
        }

        .logo-text {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .logo-text span {
            color: var(--red-cinema);
        }

        .nav-links {
            display: flex;
            gap: 2.2rem;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
            padding: 6px 0;
            border-bottom: 2px solid transparent;
            letter-spacing: 0.3px;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-primary);
            border-bottom-color: var(--red-cinema);
        }

        /* ─── container ─── */
        .container {
            max-width: 1240px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* ─── profile header (glass) ─── */
        .profile-header {
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 2rem 2.5rem;
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 2.5rem;
            transition: var(--transition-smooth);
        }

        .avatar-area {
            text-align: center;
            flex-shrink: 0;
        }

        .avatar-ring {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, var(--red-cinema), #b01016);
            border-radius: 50%;
            padding: 4px;
            transition: var(--transition-smooth);
            box-shadow: 0 0 30px rgba(227, 30, 36, 0.25);
        }
        .avatar-ring:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(227, 30, 36, 0.4);
        }
        .avatar-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(18, 22, 28, 0.8);
        }

        .badge-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--red-cinema), #b01016);
            color: #fff;
            padding: 6px 20px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 0.8rem;
            letter-spacing: 0.5px;
            box-shadow: var(--shadow-red);
        }

        .profile-info {
            flex: 1;
            min-width: 240px;
        }

        .profile-info h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 0.2rem;
            letter-spacing: -0.5px;
        }

        .info-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.2rem;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 500;
            margin: 4px 0 16px 0;
            color: var(--red-glow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1rem 0 1.4rem 0;
            max-width: 420px;
        }

        .stat-card {
            background: rgba(10, 12, 16, 0.6);
            backdrop-filter: blur(6px);
            padding: 1rem 0.8rem;
            border-radius: 1rem;
            text-align: center;
            border: 1px solid var(--border-subtle);
            transition: var(--transition-smooth);
        }
        .stat-card:hover {
            border-color: var(--red-cinema);
            transform: translateY(-4px);
            background: rgba(227, 30, 36, 0.08);
            box-shadow: var(--shadow-red);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--red-glow);
            line-height: 1.2;
            font-family: 'Archivo Black', sans-serif;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .logout-btn {
            background: rgba(227, 30, 36, 0.12);
            border: 1px solid rgba(227, 30, 36, 0.35);
            color: #f28b8b;
            padding: 10px 28px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }
        .logout-btn:hover {
            background: var(--red-cinema);
            color: #fff;
            box-shadow: var(--shadow-red);
            border-color: var(--red-cinema);
            transform: translateY(-2px);
        }

        /* ─── bookings section ─── */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .section-header h2 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: -0.3px;
        }
        .section-header h2 i {
            color: var(--red-cinema);
            margin-right: 12px;
        }

        #bookingCountLabel {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(6px);
        }
        #bookingCountLabel i {
            color: var(--red-cinema);
            margin-right: 6px;
        }

        .booking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }

        /* ─── booking card (glass + red accents) ─── */
        .booking-card {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-card);
            padding: 1.5rem;
            border: 1px solid var(--border-subtle);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .booking-card:hover {
            transform: translateY(-6px);
            border-color: var(--red-cinema);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(227, 30, 36, 0.08);
        }

        .booking-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--red-cinema), #b01016);
            border-radius: 0 4px 4px 0;
        }

        .booking-movie {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.9rem;
        }
        .booking-movie i {
            color: var(--red-cinema);
            margin-right: 8px;
        }

        .confirmed-badge {
            background: rgba(76, 175, 80, 0.12);
            color: #66bb6a;
            padding: 4px 14px;
            border-radius: var(--radius-full);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid rgba(76, 175, 80, 0.2);
            white-space: nowrap;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 7px;
        }
        .detail-item i {
            width: 20px;
            color: var(--red-glow);
            text-align: center;
        }
        .detail-item strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .price-tag {
            margin-top: 0.9rem;
            padding-top: 0.9rem;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-amount {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.3rem;
            color: var(--red-glow);
        }

        /* ─── empty state ─── */
        .empty-state {
            text-align: center;
            padding: 3.5rem 2rem;
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-card);
            border: 1px dashed var(--border-subtle);
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 3.2rem;
            color: var(--red-cinema);
            opacity: 0.4;
            margin-bottom: 1rem;
        }
        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
        }
        .empty-state a {
            color: var(--red-glow);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: var(--transition-smooth);
        }
        .empty-state a:hover {
            border-bottom-color: var(--red-cinema);
        }

        /* ─── footer ─── */
        footer {
            background: rgba(7, 10, 18, 0.9);
            backdrop-filter: blur(12px);
            text-align: center;
            padding: 1.5rem;
            margin-top: 3.5rem;
            border-top: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }

        /* ─── toast ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--red-cinema);
            color: #fff;
            padding: 14px 28px;
            border-radius: var(--radius-full);
            font-weight: 700;
            z-index: 3000;
            animation: slideIn 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast i {
            font-size: 1.1rem;
        }
        .toast.success {
            background: #2e7d32;
        }
        .toast.error {
            background: #c62828;
        }

        @keyframes slideIn {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ─── responsive ─── */
        @media (max-width: 850px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 0.8rem 1.5rem;
            }
            .nav-links {
                justify-content: center;
                gap: 1.2rem;
                flex-wrap: wrap;
            }
            .profile-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 1.8rem;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                max-width: 100%;
            }
            .container {
                padding: 0 1rem;
            }
            .profile-info h1 {
                font-size: 1.6rem;
            }
            .info-value {
                justify-content: center;
            }
        }

        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .booking-grid {
                grid-template-columns: 1fr;
            }
            .booking-movie {
                font-size: 0.95rem;
                flex-wrap: wrap;
                gap: 6px;
            }
            .profile-header {
                padding: 1.2rem;
            }
            .avatar-ring {
                width: 110px;
                height: 110px;
            }
            .nav-links {
                gap: 0.8rem;
            }
            .nav-links a {
                font-size: 0.8rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ─── cinematic background ─── -->
    <div class="cinema-backdrop"></div>
    <div class="light-bleed"></div>

<!-- ─── navbar ─── -->

    <!-- ─── NAVBAR ─── -->
    <nav class="navbar" id="navbar">
        <a href="Home.html" class="brand"><img src="image/logo.png" alt="Cinema Logo" style="height:40px; vertical-align:middle;"></a>
        <div class="nav-links">
            <a href="Home.html" class="active">Home</a>
            <a href="Movie.html">Cinemas</a>
            <a href="Profile.html">Profile</a>
            <a href="Trending.html">Trending</a>
            <a href="Settting.html">Settings</a>
        </div>
    </nav>

    <!-- ─── main ─── -->
    <div class="container">

        <!-- profile header -->
        <div class="profile-header">
            <div class="avatar-area">
                <div class="avatar-ring">
                    <!-- Avatar: uses ./image/images (1).jpg with fallback to UI Avatars API -->
                    <img src="./image/images (1).jpg" alt="avatar" id="avatarImg" onerror="this.src='https://ui-avatars.com/api/?background=E31E24&color=fff&bold=true&size=140&name=U';" />
                </div>
                <span class="badge-tag" id="userBadge">🎬 Movie Lover</span>
            </div>
            <div class="profile-info">
                <h1 id="displayName">Welcome Back</h1>
                <div class="info-label">Email Address</div>
                <div class="info-value" id="userEmailDisplay">—</div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalBookings">0</div>
                        <div class="stat-label">Tickets</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalSpent">$0</div>
                        <div class="stat-label">Spent</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalMovies">0</div>
                        <div class="stat-label">Movies</div>
                    </div>
                </div>

                <button class="logout-btn" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </div>

        <!-- bookings -->
        <div class="bookings-section">
            <div class="section-header">
                <h2><i class="fas fa-ticket-alt"></i> My Tickets</h2>
                <span id="bookingCountLabel"><i class="fas fa-film"></i> 0 bookings</span>
            </div>
            <div class="booking-grid" id="bookingGridContainer">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-pulse"></i>
                    <p>Loading your bookings…</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ─── footer ─── -->
    <footer>
        <p>© 2026 LEGEND CINEMA — Premium Cinema Experience</p>
    </footer>

    <script>
        (function() {
            // ─── state ───
            let currentUser = null;
            let currentUserId = null;
            let userBookings = [];

            // ─── toast ───
            function showToast(message, type) {
                const old = document.querySelector('.toast');
                if (old) old.remove();

                const div = document.createElement('div');
                div.className = 'toast';
                if (type === 'success') div.classList.add('success');
                if (type === 'error') div.classList.add('error');

                const icon = type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle';
                div.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 3200);
            }

            // ─── load user ───
            function loadUser() {
                const raw = localStorage.getItem('currentUser');
                if (raw) {
                    try {
                        currentUser = JSON.parse(raw);
                        currentUserId = currentUser.userId || currentUser.email;
                        updateProfileUI();
                        return;
                    } catch (_) { /* fall through */ }
                }

                // demo fallback
                currentUserId = 'demo_' + Date.now();
                currentUser = {
                    userId: currentUserId,
                    email: 'moviefan@legend.com',
                    username: 'MovieFan'
                };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateProfileUI();
            }

            function updateProfileUI() {
                if (!currentUser) return;
                const name = currentUser.username || currentUser.email?.split('@')[0] || 'Cinema Fan';
                const displayName = name.charAt(0).toUpperCase() + name.slice(1);
                document.getElementById('displayName').textContent = displayName;
                document.getElementById('userEmailDisplay').innerHTML =
                    `<i class="fas fa-envelope"></i> ${currentUser.email}`;

                // Avatar is already set via HTML with ./image/images (1).jpg
                // The onerror fallback on the img tag will handle missing images
                // But we update the avatar with the user's initial if the image fails
                const avatarImg = document.getElementById('avatarImg');
                avatarImg.onerror = function() {
                    const initial = name.charAt(0).toUpperCase();
                    this.src = `https://ui-avatars.com/api/?background=E31E24&color=fff&bold=true&size=140&name=${initial}`;
                };
            }

            // ─── sample bookings ───
            function getSampleBookings() {
                return [{
                    id: 'BK001',
                    movieTitle: 'The Dark Knight',
                    seats: ['A5', 'A6'],
                    total: 30.00,
                    date: '2026-06-15',
                    time: '7:00 PM',
                    theater: 'IMAX Central',
                    paymentMethod: 'Credit Card',
                    status: 'Confirmed'
                }, {
                    id: 'BK002',
                    movieTitle: 'Inception',
                    seats: ['B3'],
                    total: 15.00,
                    date: '2026-06-20',
                    time: '4:00 PM',
                    theater: '4K Luxe',
                    paymentMethod: 'ABA Bank',
                    status: 'Confirmed'
                }, {
                    id: 'BK003',
                    movieTitle: 'Interstellar',
                    seats: ['C1', 'C2', 'C3'],
                    total: 45.00,
                    date: '2026-06-25',
                    time: '10:00 PM',
                    theater: 'Gold Class',
                    paymentMethod: 'Wing',
                    status: 'Confirmed'
                }];
            }

            // ─── load bookings ───
            function loadBookings() {
                if (!currentUserId) return;

                // check localStorage first
                const stored = localStorage.getItem('myBookings');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length) {
                            userBookings = parsed.map(b => ({
                                ...b,
                                id: b.bookingId || b.id || 'BK' + Date.now(),
                                movieTitle: b.movieTitle || 'Movie',
                                seats: b.seats || ['A1'],
                                total: b.total || 12.00,
                                date: b.date || new Date().toISOString().slice(0, 10),
                                time: b.time || '7:30 PM',
                                theater: b.theater || 'IMAX Hall',
                                paymentMethod: b.paymentMethod || 'Card',
                                status: b.status || 'Confirmed'
                            }));
                            renderBookings();
                            updateStats();
                            return;
                        }
                    } catch (_) { /* fall through */ }
                }

                // fallback to sample data
                userBookings = getSampleBookings();
                renderBookings();
                updateStats();
            }

            // ─── render ───
            function renderBookings() {
                const container = document.getElementById('bookingGridContainer');

                if (!userBookings || userBookings.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-ticket-alt"></i>
                            <p>You haven't booked any tickets yet</p>
                            <a href="Movie.html">Browse Movies <i class="fas fa-arrow-right"></i></a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = userBookings.map((b, idx) => {
                    const seats = Array.isArray(b.seats) ? b.seats.join(', ') : (b.seats || 'A1');
                    const total = parseFloat(b.total || 0).toFixed(2);
                    const date = b.date || '2026-06-30';
                    const time = b.time || '7:30 PM';
                    const theater = b.theater || 'IMAX Hall 1';
                    const method = b.paymentMethod || 'Card';
                    const status = b.status || 'Confirmed';
                    const title = b.movieTitle || 'Movie';
                    const bid = b.id || b.bookingId || `BK${idx + 1}`;

                    return `
                        <div class="booking-card">
                            <div class="booking-movie">
                                <span><i class="fas fa-film"></i>${title}</span>
                                <span class="confirmed-badge"><i class="fas fa-check-circle"></i> ${status}</span>
                            </div>
                            <div class="detail-item"><i class="fas fa-hashtag"></i> Booking ID: <strong>${bid}</strong></div>
                            <div class="detail-item"><i class="fas fa-calendar-alt"></i> Date: <strong>${date}</strong> at <strong>${time}</strong></div>
                            <div class="detail-item"><i class="fas fa-chair"></i> Seats: <strong>${seats}</strong></div>
                            <div class="detail-item"><i class="fas fa-theater-masks"></i> Theater: <strong>${theater}</strong></div>
                            <div class="detail-item"><i class="fas fa-credit-card"></i> Payment: <strong>${method}</strong></div>
                            <div class="price-tag">
                                <span><i class="fas fa-tag"></i> Total Paid</span>
                                <span class="price-amount">$${total}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ─── stats ───
            function updateStats() {
                const totalTickets = userBookings.reduce((sum, b) => {
                    const seats = Array.isArray(b.seats) ? b.seats.length : 1;
                    return sum + seats;
                }, 0);

                const totalSpent = userBookings.reduce((sum, b) => sum + (parseFloat(b.total) || 0), 0).toFixed(2);
                const uniqueMovies = new Set(userBookings.map(b => b.movieTitle)).size;

                document.getElementById('totalBookings').textContent = totalTickets;
                document.getElementById('totalSpent').textContent = `$${totalSpent}`;
                document.getElementById('totalMovies').textContent = uniqueMovies;
                document.getElementById('bookingCountLabel').innerHTML =
                    `<i class="fas fa-film"></i> ${userBookings.length} bookings`;
            }

            // ─── logout ───
            window.handleLogout = function() {
                if (confirm('Sign out of your account?')) {
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('myBookings');
                    showToast('Signed out successfully', 'success');
                    setTimeout(() => {
                        window.location.href = 'Login.html';
                    }, 800);
                }
            };

            // ─── init ───
            loadUser();
            loadBookings();

            // auto-refresh stats every 8s
            setInterval(() => {
                renderBookings();
                updateStats();
            }, 8000);

            // expose toast for debugging
            window.showToast = showToast;
        })();
    </script>

</body>
</html>
